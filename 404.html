<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · Arturo Núñez</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090D">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

  <!-- Página 404 que Netlify sirve para cualquier ruta inexistente. Rutas absolutas a propósito. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#08090D', surface: '#11131A', raised: '#171A23', fg: '#F4F4F5',
            muted: '#9295A1', violet: '#8B5CF6', cyan: '#38BDF8', line: 'rgba(255,255,255,0.09)',
          },
          fontFamily: {
            sans: ['Geist', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            serif: ['"Instrument Serif"', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="flex min-h-screen flex-col font-sans antialiased">
  <svg width="0" height="0" class="absolute" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>

  <header class="border-b border-line">
    <div class="mx-auto flex h-16 max-w-[1240px] items-center px-4 sm:px-6 lg:px-8">
      <a href="/" aria-label="Arturo Núñez · DevsArt, ir al inicio">
        <img src="/img/logo-devsart.png" alt="DevsArt" width="360" height="120" class="h-9 w-auto">
      </a>
    </div>
  </header>

  <main class="relative flex flex-1 items-center overflow-hidden">
    <div class="dot-grid pointer-events-none absolute inset-0"></div>
    <div class="aura pointer-events-none absolute -right-40 -top-40 h-[560px] w-[560px]"></div>

    <div class="relative mx-auto grid w-full max-w-[1240px] items-center gap-14 px-4 py-20 sm:px-6 lg:grid-cols-12 lg:px-8">
      <div class="lg:col-span-7">
        <p class="label">Error 404</p>
        <h1 class="display text-balance mt-6 text-[2.75rem] sm:text-6xl lg:text-[5rem]">Esta página <span class="serif font-normal text-violet">no existe.</span></h1>
        <p class="text-pretty mt-7 max-w-lg text-lg leading-relaxed text-muted">La dirección que abriste no lleva a ningún lado. Puede que el enlace esté mal escrito o que la página se haya movido.</p>
        <div class="mt-10 flex flex-col gap-3 sm:flex-row">
          <a href="/" class="btn btn-primary">
            Volver al inicio
            <svg class="arrow h-4 w-4"><use href="#i-arrow"/></svg>
          </a>
          <a href="/#proyectos" class="btn btn-secondary">Ver proyectos</a>
        </div>
      </div>

      <div class="lg:col-span-5">
        <div class="mock mx-auto max-w-[460px]">
          <div class="mock-bar"><i></i><i></i><i></i><span class="ml-2 font-mono text-[11px] text-muted">request.log</span></div>
          <pre class="overflow-x-auto p-5 font-mono text-[12px] leading-7 text-muted"><span class="text-cyan">GET</span> <span id="path" class="text-fg">/</span>
<span class="text-violet">404</span> Not Found
<span class="text-white/30">→ sugerencia:</span> <a href="/" class="text-fg underline decoration-white/30 underline-offset-4 hover:decoration-fg">/</a></pre>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-line">
    <p class="mx-auto max-w-[1240px] px-4 py-8 text-center font-mono text-xs text-muted sm:px-6 lg:px-8">© 2026 DevsArt. Todos los derechos reservados.</p>
  </footer>

  <script>
    // Muestra la ruta que se intentó abrir (solo como texto)
    var p = document.getElementById('path');
    var ruta = location.pathname;
    try { ruta = decodeURIComponent(ruta); } catch (e) { /* URL mal formada: se muestra tal cual */ }
    if (p) p.textContent = ruta.slice(0, 60) || '/';
  </script>
</body>
</html>
